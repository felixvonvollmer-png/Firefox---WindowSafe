name: Foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.4'
      - name: Foundation lint and guards
        run: python3 tools/foundation.py check
      - name: Harness contract regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Bound review compatibility and schema preflight
        run: |
          python3 tools/foundation.py schema-preflight --sha HEAD --schema reviews/review-contract.json
          python3 tools/foundation.py validate-result --file reviews/results/WS-PFR-20260917-01.json
          python3 tools/foundation.py validate-result --file reviews/results/WS-PFR-20260918-01.json
          python3 tools/foundation.py validate-result --file reviews/results/WS-PFR-20260918-02.json
      - name: Exact epic preparation request
        run: python3 tools/foundation.py request --sha HEAD --subject epics/WS-E01/subject.json
      - name: F01 pinned static toolchain qualification
        run: python3 qualification/ws-e01-f01/toolchain.py --setup
      - name: Deterministic foundation build
        run: python3 tools/foundation.py build --verify-repeat
      - name: Append-only provenance and review history
        env:
          FOUNDATION_EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/foundation.py history --event-base
      - name: Whitespace and clean tracked tree
        run: |
          git diff --check
          git diff --exit-code
  qualification-windows-static:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.4'
      - name: F01 Windows static build and lint only - no native GUI evidence
        run: python qualification/ws-e01-f01/toolchain.py --setup
      - name: Qualification binding and synthetic Job regressions - no Desktop evidence
        run: |
          python -m unittest discover -s tests -p test_target_qualification.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_windows_job.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
