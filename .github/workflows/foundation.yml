name: Foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.4'
      - name: Foundation lint and guards
        run: python3 tools/foundation.py check
      - name: Harness contract regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Deterministic foundation build
        run: python3 tools/foundation.py build --verify-repeat
      - name: Append-only provenance and review history
        env:
          FOUNDATION_EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/foundation.py history --event-base
      - name: Whitespace and clean tracked tree
        run: |
          git diff --check
          git diff --exit-code
